name: Run pytest
description: Run pytest on the codebase
inputs:
  python-version:
    description: 'Python version to use'
    required: true
    default: '3.11'
runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Dependencies
      run: pip install -r test-requirements.txt
      shell: bash
    - name: Run pytest with JSON coverage
      id: pytest-cov
      shell: bash
      run: |
          pytest --cov=. --cov-report=json:coverage.json
          # Extract total coverage percentage (integer)
          COVERAGE=$(python -c "import json; data=json.load(open('coverage.json')); print(int(data['totals']['percent_covered']))")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage is $COVERAGE%"

    - name: Run extra step if coverage > 90%
      if: steps.pytest-cov.outputs.coverage > 90
      shell: bash
      run: |
          echo "Coverage is above 90%! "
        