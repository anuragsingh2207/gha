name: Scheduled CI
on:
  schedule:
    - cron: '5 * * * *' # Runs every 2 minutes
jobs:
  cron:
    name: Scheduled Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Print Message
        run: echo "Hello from Scheduled Workflow"