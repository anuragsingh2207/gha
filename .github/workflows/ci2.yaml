name: Python CI2
on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:
    inputs:
      image_tag:
        type: string
        required: true
        default: 0.0.1


env:
  ENV1: "Worklfow Level Env Var"
  IMAGE_TAG: ${{ github.event.inputs.image_tag ||  '0.0.3'}}

jobs:
  build:
    name: build
    env:  
      ENV2: "Job Level Env Var"
    runs-on: ubuntu-latest
    startegy:
    
    outputs: 
      image_tag: ${{steps.tag.outputs.image_tag}}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
    - name: Print workflow level env var
      run: echo ${{ env.ENV1 }}
    - name: Print job level env var
      run: echo "$ENV2"
    - name: Print step level env var
      env:
        ENV3: "Step Level Env Var"
      run: echo "$ENV3"
    - name: Print built-in env vars
      run: |
        echo "GITHUB_REPOSITORY: ${{ github.repository }}"
        echo "GITHUB_REF: ${{ github.ref }}"
        echo "GITHUB_SHA: ${{ github.sha }}"
        echo "GITHUB_ACTOR: ${{ github.actor }}"
        echo "GITHUB_EVENT_NAME: ${{ github.event_name }}"
        echo "GITHUB_WORKFLOW: ${{ github.workflow }}"
        echo "GITHUB_RUN_ID: ${{ github.run_id }}"
        echo "GITHUB_RUN_NUMBER: ${{ github.run_number }}"
    - name: Set env vars dynamically
      run:
        echo "DYNAMIC_ENV_VAR=Dynamic Value" >> $GITHUB_ENV
    - name: Print dynamically set env var
      run: echo "$DYNAMIC_ENV_VAR"
    - name: Run Pytest
      uses: ./.github/actions/pytest
      with:
        python-version: 3.11
    - name: Build docker image
      run: docker build -t anuragsingh2207/python:${{env.IMAGE_TAG}} .
    - name: Trivy Scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: anuragsingh2207/python:${{env.IMAGE_TAG}}
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        format: 'table'
        exit-code: '1'
    - name: Setup Docker image_tag Output
      id: tag
      run: echo "image_tag=${{env.IMAGE_TAG}}" >> $GITHUB_OUTPUT
    - name: Docker Login
      uses: docker/login-action@v4
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Docker Push 
      run: docker push anuragsingh2207/python:${{env.IMAGE_TAG}}
  
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print image tag
        run: echo ${{ needs.build.outputs.image_tag }}
      # - name: Authenticate to GCP 
      #   uses: google-github-actions/auth@v2
      #   with:
      #     project_id: ${{ secrets.GCP_PROJECT}}
      #     workload_identity_provider: ${{ secrets.WIF_PROVIDER}}
      - name: Setup Gcloud 
        uses: google-github-actions/setup-gcloud@v3
      - name: Validate gcloud setup
        run: gcloud info
      # - name: Authenticate to GAR
      #   run: gcloud auth configure-docker eu-docker.pkg.dev
