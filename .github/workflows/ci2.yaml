name: Python CI2
on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:
    inputs:
      image_tag:
        type: string
        required: true
        default: 0.0.1


env:
  MESSAGE: "Hello from GHA"
  IMAGE_TAG: ${{ github.event.inputs.image_tag ||  '0.0.3'}}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs: 
      image_tag: ${{steps.tag.outputs.image_tag}}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
    - name: Print Message
      run: echo ${{ env.MESSAGE }}
    - name: Run Pytest
      uses: ./github/actions/pytest
      with:
        python-version: 3.11
    - name: Build docker image
      run: docker build -t anuragsingh2207/python:${{env.IMAGE_TAG}} .
    - name: Trivy Scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: anuragsingh2207/python:${{env.IMAGE_TAG}}
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        format: 'table'
        exit-code: '1'
    - name: Setup Docker image_tag Output
      id: tag
      run: echo "image_tag=${{env.IMAGE_TAG}}" >> $GITHUB_OUTPUT
    - name: Docker Login
      uses: docker/login-action@v4
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Docker Push 
      run: docker push anuragsingh2207/python:${{env.IMAGE_TAG}}
  
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print image tag
        run: echo ${{ needs.build.outputs.image_tag }}
      # - name: Authenticate to GCP 
      #   uses: google-github-actions/auth@v2
      #   with:
      #     project_id: ${{ secrets.GCP_PROJECT}}
      #     workload_identity_provider: ${{ secrets.WIF_PROVIDER}}
      - name: Setup Gcloud 
        uses: google-github-actions/setup-gcloud@v3
      - name: Validate gcloud setup
        run: gcloud info
