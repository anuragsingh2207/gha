name: Python CI
on:
  push:
    branches: [main, feature/*]

env:
  MESSAGE: "Hello from GHA"

jobs:
  ci: 
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Print Message
        run: echo ${{ env.MESSAGE }}
      - name : Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r test-requirements.txt 
      - name: Run Bandit security checks
        run: bandit -r . -ll
      - name: Run pip-audit for dependency vulnerabilities
        run: pip-audit --progress spinner
      - name: Run pytest
        run: pytest
      - name: Build Docker image 
        run: docker build -t anuragsingh2207/python:0.0.1 .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anuragsingh2207/python:0.0.1
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Push
        run: docker push anuragsingh2207/python:0.0.1